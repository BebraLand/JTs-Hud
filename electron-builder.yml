appId: com.jtshudhmanager.app
productName: JTs Hud Manager
directories:
  buildResources: resources
files:
  - '**/*'
  - '!**/.vscode/*'
  - '!src/**/*'
  - '!{docs,e2e,fixtures,scripts,test-results}/**/*'
  - '!out/tests/**/*'
  - '!playwright.config.ts'
  - '!package-lock.json'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,knowledgebase.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - 'resources/default-hud/**/*'
  - 'resources/auto-director/**/*'
protocols:
  name: jtshudhmanager
  schemes:
    - jtshudhmanager
win:
  executableName: JTs Hud Manager
  icon: icon.ico
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
portable:
  artifactName: ${name}-${version}-auto-director-experimental-portable.${ext}
mac:
  entitlementsInherit: entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: auuruum
  repo: JTs-Hud
