name: Build JTs-Hud with MAT integration (Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mat-integration

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Windows installer
        run: npm run build:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Smoke-test packaged Windows runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $token = 'workflow-smoke-token'
          $mockPort = 19891
          $hudPort = 18891
          $env:HUD_PORT = "$hudPort"
          $env:GSI_PORT = '18892'
          $exe = Join-Path $PWD 'dist\win-unpacked\JTs Hud Manager.exe'
          if (-not (Test-Path $exe)) { throw "Packaged executable not found: $exe" }

          function Wait-Json([string]$url) {
            for ($i = 0; $i -lt 60; $i++) {
              try { return Invoke-RestMethod -Uri $url -TimeoutSec 2 }
              catch { Start-Sleep -Seconds 1 }
            }
            throw "Timed out waiting for $url"
          }

          function Wait-MatConnected([string]$url) {
            for ($i = 0; $i -lt 30; $i++) {
              $status = Invoke-RestMethod -Uri $url -TimeoutSec 2
              Write-Host "MAT status: $($status.state), $($status.message)"
              if ($status.state -eq 'connected') { return $status }
              Start-Sleep -Seconds 1
            }
            throw 'Packaged app did not connect to mock MAT.'
          }

          function Stop-Tree($process) {
            if ($null -ne $process -and -not $process.HasExited) {
              & taskkill.exe /PID $process.Id /T /F | Out-Null
            }
            Get-CimInstance Win32_Process | Where-Object {
              $_.ExecutablePath -eq $exe
            } | ForEach-Object {
              Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
            }
          }

          function Stop-AppGracefully($process) {
            if ($null -eq $process -or $process.HasExited) { return }
            if (-not $process.CloseMainWindow()) {
              throw 'Packaged app did not accept a graceful window close.'
            }
            if (-not $process.WaitForExit(15000)) {
              throw 'Packaged app did not exit gracefully within 15 seconds.'
            }
            Start-Sleep -Seconds 1
            $remaining = @(Get-CimInstance Win32_Process | Where-Object {
              $_.ExecutablePath -eq $exe
            })
            if ($remaining.Count -ne 0) {
              throw 'Packaged Electron child processes remained after graceful shutdown.'
            }
          }

          $mock = $null
          $app = $null
          try {
            $mock = Start-Process -FilePath 'node' `
              -ArgumentList 'scripts\mock-mat-server.cjs' `
              -Environment @{ MAT_HUD_TOKEN = $token; MOCK_MAT_PORT = "$mockPort" } `
              -PassThru -NoNewWindow
            $mockProjectionUrl = "http://127.0.0.1:$mockPort/api/integrations/jts-hud/v1/current"
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $mockProjection = Invoke-RestMethod -Uri $mockProjectionUrl `
                  -Headers @{ Authorization = "Bearer $token" } -TimeoutSec 2
                if ($mockProjection.contract -eq 'bebraland-mat-hud') { break }
              }
              catch { Start-Sleep -Seconds 1 }
            }
            if ($mockProjection.contract -ne 'bebraland-mat-hud') {
              throw 'Mock MAT did not become ready.'
            }

            $app = Start-Process -FilePath $exe -ArgumentList '--disable-gpu' -PassThru
            $settingsUrl = "http://127.0.0.1:$hudPort/api/settings"
            $matSettingsUrl = "$settingsUrl/mat"
            $statusUrl = "$matSettingsUrl/status"
            Wait-Json $settingsUrl | Out-Null

            $body = @{
              enabled = $true
              url = "http://127.0.0.1:$mockPort"
              token = $token
              pollIntervalSeconds = 2
            } | ConvertTo-Json
            $saved = Invoke-RestMethod -Uri $matSettingsUrl -Method Put -ContentType 'application/json' -Body $body
            $savedJson = $saved | ConvertTo-Json -Depth 10
            if (-not $saved.tokenConfigured) { throw 'Packaged app did not persist the MAT token.' }
            if ($savedJson.Contains($token)) { throw 'MAT token leaked from the packaged settings response.' }
            Wait-MatConnected $statusUrl | Out-Null

            Stop-AppGracefully $app
            $app = $null
            Start-Sleep -Seconds 2

            $app = Start-Process -FilePath $exe -ArgumentList '--disable-gpu' -PassThru
            $stored = Wait-Json $settingsUrl
            $storedJson = $stored | ConvertTo-Json -Depth 10
            if (-not $stored.matTokenConfigured) { throw 'MAT token did not survive packaged app restart.' }
            if ($storedJson.Contains($token)) { throw 'MAT token leaked after packaged app restart.' }
            Wait-MatConnected $statusUrl | Out-Null
            Stop-AppGracefully $app
            $app = $null
            Write-Host 'Packaged Windows runtime smoke test passed.'
          }
          finally {
            Stop-Tree $app
            Stop-Tree $mock
          }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $source = Join-Path $PWD 'dist\win-unpacked\*'
          $destination = Join-Path $PWD "dist\JTs-Hud-$version-windows-portable.zip"
          Compress-Archive -Path $source -DestinationPath $destination -Force

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem dist -File | Where-Object {
            $_.Name -like '*-setup.exe' -or $_.Name -like '*-windows-portable.zip'
          })
          if ($artifacts.Count -lt 2) {
            throw 'Expected both installer and portable ZIP before checksum generation.'
          }
          $lines = $artifacts | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          Set-Content -Path 'dist\SHA256SUMS.txt' -Value $lines -Encoding ascii

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JTs-Hud-MAT-Windows
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*-setup.exe
            dist/*-windows-portable.zip
            dist/SHA256SUMS.txt
